<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали велосипеда — Структура</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="index.html" class="back-btn">← Назад в каталог</a>

    <div class="page-title">
        <h1>Mountain bike Trek Marlin</h1>
        <p>Нажмите на карточку детали, чтобы узнать подробные характеристики</p>
    </div>

    <!-- Геометрический макет -->
    <div class="interactive-layout">
        
        <!-- Левая колонка деталей -->
        <div class="parts-column">
            <a href="#" class="part-card">
                <img src="./parts/saddle.png" alt="Переднее колесо">
                <h4>Седло</h4>
                <span>Подседельная труба</span>
            </a>

            <a href="#" class="part-card">
                <img src="./parts/cassette.png" alt="Седло">
                <h4>Кассета</h4>
                <span>Алюминиевый сплав</span>
            </a>

            <a href="./perekidka-detail.html" class="part-card">
                <img src="parts/perekidka.png" alt="Седло">
                <h4>Перекидка</h4>
                <span>Алюминиевый сплав</span>
            </a>
        </div>

        <!-- Центральный велосипед -->
        <div class="bike-center">
            <img src="./img/bike1.png" alt="Велосипед">
        </div>

        <!-- Правая колонка деталей -->
        <div class="parts-column">
            <a href="#" class="part-card">
                <img src="./parts/manetk.png" alt="Седло">
                <h4>Манетка</h4>
                <span>Shimano</span>
            </a>

            <a href="#" class="part-card">
                <img src="./parts/vylka.png" alt="Заднее колесо">
                <h4>Вилка</h4>
                <span>12 скоростей</span>
            </a>

            <a href="#" class="part-card">
                <img src="./parts/disc-brake.png" alt="Заднее колесо">
                <h4>Кассета / Заднее колесо</h4>
                <span>12 скоростей</span>
            </a>
        </div>

    </div>

</body>
</html>
